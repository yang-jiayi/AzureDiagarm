# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-architecture-diagram-builder
metadata:
  template: azure-architecture-diagram-builder@1.0.0

# The generic azd deployment path is intentionally retired in this secured
# fork. It did not configure the production Front Door, Easy Auth assignment,
# Conditional Access, or origin-isolation controls. Keep explicit failing hooks
# so azd commands stop before changing Azure resources.
hooks:
  preprovision:
    shell: sh
    run: scripts/retired-azd-deployment.sh
    interactive: false
    continueOnError: false
  prepackage:
    shell: sh
    run: scripts/retired-azd-deployment.sh
    interactive: false
    continueOnError: false
  predeploy:
    shell: sh
    run: scripts/retired-azd-deployment.sh
    interactive: false
    continueOnError: false

services:
  app:
    project: .
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
  # Decoupled MCP server — its own Container App / FQDN. Build context is the
  # repo root so the MCP build can read the web app's icon/pricing data.
  mcp:
    project: .
    language: ts
    host: containerapp
    docker:
      path: ./mcp-server/Dockerfile
      context: .
