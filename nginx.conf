server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Replaced at image build time so the Container Apps origin cannot bypass
    # this deployment's Azure Front Door and WAF.
    #FDID_CHECK#

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    # Easy Auth validates unsafe cookie-authenticated requests using the
    # same-origin Referer. Suppress referrers only when navigating off-site.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
    # Delegated Azure import uses a same-window MSAL redirect, so the stricter
    # opener isolation remains compatible while protecting the application.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Public health endpoint used by Azure Front Door and deployment checks.
    # This is the only application path excluded from Easy Auth.
    location = /healthz {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        proxy_pass http://127.0.0.1:3001/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
    }

    # Container Apps startup/readiness probes use configuration-aware
    # readiness, while /healthz remains a liveness and Front Door health check.
    location = /readyz {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        proxy_pass http://127.0.0.1:3001/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
    }

    # Internal authorization subrequest. The Node server validates the trusted
    # Easy Auth identity headers against the Key Vault-backed whitelist.
    location = /_access_check {
        internal;
        proxy_pass http://127.0.0.1:3001/api/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL $http_x_ms_client_principal;
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $http_x_ms_client_principal_name;
        proxy_set_header X-MS-CLIENT-PRINCIPAL-ID $http_x_ms_client_principal_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Do not expose the internal access-check endpoint through /api/.
    location = /api/access/check {
        return 404;
    }

    # Authenticated users who are not on the application whitelist receive a
    # dedicated explanation instead of the SPA or a blank nginx error page.
    # nginx replaces (not merges) the inherited add_header set as soon as a
    # location declares one of its own, so every block below has to restate the
    # full security header set.
    location = /access-denied.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files /access-denied.html =403;
    }

    location @api_authentication_required {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        return 401 '{"error":{"source":"application_auth","code":"application_authentication_required","message":"Application sign-in is required."}}';
    }

    location @api_access_denied {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        return 403 '{"error":{"source":"application_auth","code":"application_access_denied","message":"This account is not allowed to use the application."}}';
    }

    # Proxy API endpoints (speech token + Azure OpenAI proxy) to the local
    # Node.js token server (never exposed externally).
    #
    # Long timeouts: the /api/openai proxy waits on Azure OpenAI, which for
    # large prompts on reasoning models (including GPT-5.6 Sol with high
    # reasoning effort) can take well over nginx's 60s default — which surfaced
    # as intermittent "504 Gateway Time-out" errors (worse on 2nd+ refinements
    # as context grows). Keep this below Front Door's 240-second origin limit.
    #
    # client_max_body_size 12m matches the token server's body limit so vision
    # requests that embed base64 images aren't rejected with 413.
    location /api/ {
        auth_request /_access_check;
        error_page 401 = @api_authentication_required;
        error_page 403 = @api_access_denied;
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MS-CLIENT-PRINCIPAL $http_x_ms_client_principal;
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $http_x_ms_client_principal_name;
        proxy_set_header X-MS-CLIENT-PRINCIPAL-ID $http_x_ms_client_principal_id;
        proxy_connect_timeout 75s;
        proxy_send_timeout 220s;
        proxy_read_timeout 220s;
        client_max_body_size 12m;
    }

    # MCP HTTP transport — streamable HTTP + SSE.
    # Buffering off and long read timeout because the streamable transport
    # holds open SSE connections; HTTP/1.1 with no Connection upgrade so the
    # mcp-session-id header round-trips correctly.
    location = /mcp {
        auth_request /_access_check;
        proxy_pass http://127.0.0.1:3030/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_disabled;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # MCP health probe (proxies to the MCP server's /healthz).
    location = /mcp/healthz {
        auth_request /_access_check;
        proxy_pass http://127.0.0.1:3030/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_disabled;
    }

    location @mcp_disabled {
        return 404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        auth_request /_access_check;
        error_page 401 403 = /access-denied.html;
        try_files $uri $uri/ /index.html;
    }

    # Browser caching remains enabled, but shared-cache eligibility is disabled
    # because every asset is protected by the signed-in user's whitelist status.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        auth_request /_access_check;
        expires 1y;
        add_header Cache-Control "private, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Don't cache index.html
    location = /index.html {
        auth_request /_access_check;
        error_page 401 403 = /access-denied.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://login.microsoftonline.com https://management.azure.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://js.monitor.azure.com https://dc.services.visualstudio.com https://*.cognitiveservices.azure.com https://*.speech.microsoft.com wss://*.speech.microsoft.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
