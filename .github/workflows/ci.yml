name: CI

# Build verification for the app (and MCP server) on every push and PR.
# Catches "forgot to commit a file" and type errors before they reach a
# collaborator's clone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Vite app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install token server dependencies
        run: npm --prefix server ci

      - name: Audit production dependencies
        run: |
          npm run audit:production
          npm --prefix server audit --omit=dev --audit-level=high

      - name: Build (tsc + vite)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test application core
        run: npm test

      - name: Test Office exports
        run: npm run test:exports

      - name: Test workspace editing
        run: npm run test:workspace

      - name: Test token server
        run: npm --prefix server test

      - name: Build the complete runtime image
        run: |
          docker build \
            --build-arg VITE_AZURE_OPENAI_ENDPOINT=https://container-test.openai.azure.com/ \
            --build-arg VITE_AZURE_OPENAI_DEPLOYMENT_GPT6ASTRA=gpt-6-astra \
            --tag azurediagarm-validation:"${GITHUB_SHA}" .

      - name: Start all runtime processes and verify readiness
        run: |
          set -Eeuo pipefail
          container="$(docker run --detach \
            --publish 127.0.0.1:18080:80 \
            --env APP_DEPLOYMENT_MODE=local \
            --env ACCESS_CONTROL_ENABLED=false \
            --env AI_BUDGET_STORE=memory \
            --env MCP_ENABLED=true \
            --env AZURE_OPENAI_ENDPOINT=https://container-test.openai.azure.com/ \
            --env AZURE_OPENAI_ALLOWED_DEPLOYMENTS=gpt-6-astra \
            azurediagarm-validation:"${GITHUB_SHA}")"
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 ]]; then docker logs "$container"; fi
            docker rm --force "$container" >/dev/null
            exit "$status"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --max-time 5 \
            --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:18080/healthz
          readiness="$(curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18080/readyz)"
          if [[ "$readiness" != "ready" ]]; then
            echo "::error::API did not report configuration-aware readiness."
            exit 1
          fi
          docker exec "$container" node --input-type=module -e '
            let lastError;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3030/healthz", { signal: AbortSignal.timeout(2000) });
                if (!response.ok) throw new Error(`MCP readiness returned ${response.status}`);
                process.exit(0);
              } catch (error) {
                lastError = error;
              }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            console.error(lastError);
            process.exit(1);
          '

  e2e:
    name: Test critical browser flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The production-export gate reads dist/ and skips without it. A skipped
      # gate reports green, and the bug it guards against only exists in a real
      # build, so CI has to produce one.
      - name: Build application
        run: npm run build

      - name: Test critical flows
        run: npm run test:e2e

      - name: Test workspace browser safeguards
        run: |
          npm run test:workspace:browser
          npm run test:ai-ui
          npm run test:inspector-ui
          npm run test:modal-focus

      # Visual baselines are rendered on Linux, so a Windows or macOS developer
      # cannot reproduce a screenshot diff locally. Publishing the report and
      # the "-actual" images makes CI-only failures debuggable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  build-mcp:
    name: Build (MCP server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: mcp-server
        run: npm run build

      # The build's prebuild step regenerates iconMap/iconSvgs/pricing from the
      # frontend sources. Those outputs are committed, so adding a frontend icon
      # without re-running the sync leaves them stale. Only the deploy workflow
      # used to notice, which turned ordinary drift into a blocked production
      # deployment after merge. Fail here instead, while it is still a pull request.
      - name: Verify generated files are current
        run: |
          set -Eeuo pipefail
          if ! git diff --exit-code -- mcp-server/src; then
            echo "::error::mcp-server generated files are stale. Run 'npm --prefix mcp-server run build' and commit the result."
            exit 1
          fi

      - name: Test
        working-directory: mcp-server
        run: npm test
