name: CI

# Build verification for the app (and MCP server) on every push and PR.
# Catches "forgot to commit a file" and type errors before they reach a
# collaborator's clone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Vite app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install token server dependencies
        run: npm --prefix server ci

      - name: Audit production dependencies
        run: |
          npm run audit:production
          npm --prefix server audit --omit=dev --audit-level=high

      - name: Build (tsc + vite)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test application core
        run: npm test

      - name: Test token server
        run: npm --prefix server test

  e2e:
    name: Test critical browser flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test critical flows
        run: npm run test:e2e

      # Visual baselines are rendered on Linux, so a Windows or macOS developer
      # cannot reproduce a screenshot diff locally. Publishing the report and
      # the "-actual" images makes CI-only failures debuggable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  build-mcp:
    name: Build (MCP server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: mcp-server
        run: npm run build

      # The build's prebuild step regenerates iconMap/iconSvgs/pricing from the
      # frontend sources. Those outputs are committed, so adding a frontend icon
      # without re-running the sync leaves them stale. Only the deploy workflow
      # used to notice, which turned ordinary drift into a blocked production
      # deployment after merge. Fail here instead, while it is still a pull request.
      - name: Verify generated files are current
        run: |
          set -Eeuo pipefail
          if ! git diff --exit-code -- mcp-server/src; then
            echo "::error::mcp-server generated files are stale. Run 'npm --prefix mcp-server run build' and commit the result."
            exit 1
          fi

      - name: Test
        working-directory: mcp-server
        run: npm test
