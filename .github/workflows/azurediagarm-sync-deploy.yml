name: AzureDiagarm sync and deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even when the source commits have not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: azurediagarm-production
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder.git
  IMAGE_REPOSITORY: azurediagarm/app

jobs:
  merge_validate:
    name: Merge and validate upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      fork_commit: ${{ steps.source.outputs.fork_commit }}
      upstream_short: ${{ steps.source.outputs.upstream_short }}
      fork_short: ${{ steps.source.outputs.fork_short }}
      update_details_b64: ${{ steps.source.outputs.update_details_b64 }}
    steps:
      - name: Check out customization fork
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            mcp-server/package-lock.json

      - name: Merge approved upstream source
        id: source
        run: |
          set -Eeuo pipefail

          git config user.name "azurediagarm-updater"
          git config user.email "azurediagarm-updater@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPOSITORY"

          fork_before="$(git rev-parse HEAD)"
          git fetch upstream main
          upstream_commit="$(git rev-parse upstream/main)"

          # Never auto-merge upstream changes that can alter GitHub credentials,
          # Azure deployment behavior, origin protection, or server-side controls.
          merge_base="$(git merge-base HEAD upstream/main)"
          mapfile -t protected_changes < <(
            git diff --name-only "$merge_base..upstream/main" -- \
              .github \
              .dockerignore \
              Dockerfile \
              azure.yaml \
              index.html \
              infra \
              package.json \
              package-lock.json \
              nginx.conf \
              server \
              start.sh \
              public \
              mcp-server \
              scripts \
              vite.config.ts \
              tsconfig.json \
              tsconfig.node.json \
              eslint.config.js \
              blueprint-preview.html
          )
          if (( ${#protected_changes[@]} > 0 )); then
            {
              echo "Upstream changed protected deployment or security files."
              echo "Automatic merge was stopped for manual review."
              echo
              echo "Upstream commit: $upstream_commit"
              echo "Customization commit: $fork_before"
              echo
              echo "Protected files:"
              printf -- '- %s\n' "${protected_changes[@]}"
            } > update-details.txt
            echo "::error::Upstream changed protected deployment or security files. See update-details.txt."
            exit 1
          fi

          if ! git merge --no-edit upstream/main; then
            {
              echo "Upstream merge conflict detected."
              echo
              echo "Upstream commit: $upstream_commit"
              echo "Customization commit: $fork_before"
              echo
              echo "Conflicting files:"
              git diff --name-only --diff-filter=U
            } > update-details.txt
            git merge --abort
            echo "::error::Upstream changes conflict with AzureDiagarm customizations. See update-details.txt."
            exit 1
          fi
          fork_commit="$(git rev-parse HEAD)"
          source_changed=false
          if [[ "$fork_before" != "$fork_commit" ]]; then
            source_changed=true
          fi

          {
            echo "source_changed=$source_changed"
            echo "upstream_commit=$upstream_commit"
            echo "fork_commit=$fork_commit"
            echo "upstream_short=${upstream_commit:0:12}"
            echo "fork_short=${fork_commit:0:12}"
          } >> "$GITHUB_OUTPUT"

          git log \
            --no-merges \
            --date=iso-strict \
            --pretty=format:'- %h %ad %an: %s' \
            "${merge_base}..${upstream_commit}" > update-details.txt

          if [[ ! -s update-details.txt ]]; then
            printf '%s\n' "- No new upstream commits; deploying customization commit ${fork_commit:0:12}." > update-details.txt
          fi
          echo "update_details_b64=$(base64 -w 0 update-details.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate merged source before publishing
        run: |
          set -Eeuo pipefail
          git diff --check
          npm ci --ignore-scripts
          npm run build
          npm run lint
          node --check server/token-server.js
          node --check server/access-control.js
          node --check server/arm-key-vault-access-store.js
          npm --prefix server ci --ignore-scripts
          npm --prefix server test
          npm --prefix mcp-server ci --ignore-scripts
          npm --prefix mcp-server run build
          git diff --exit-code

      - name: Publish validated upstream merge
        if: steps.source.outputs.source_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

  notify_validation_failure:
    name: Notify validation failure
    needs: merge_validate
    if: ${{ always() && needs.merge_validate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Send validation failure email
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
        run: |
          failure_body="$(
            printf 'The AzureDiagarm upstream merge or validation failed.\n\nWorkflow: %s\n' \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )"
          az extension add --name communication --yes --only-show-errors
          az communication email send \
            --sender "${{ vars.AZURE_EMAIL_SENDER }}" \
            --to "${{ vars.AZURE_EMAIL_RECIPIENT }}" \
            --subject "AzureDiagarm update validation failed" \
            --text "$failure_body" \
            --wait-until completed \
            --output none

  deploy:
    name: Deploy validated revision
    needs: merge_validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.merge_validate.outputs.fork_commit }}
          persist-credentials: false

      - name: Restore update details
        run: |
          printf '%s' "${{ needs.merge_validate.outputs.update_details_b64 }}" \
            | base64 --decode > update-details.txt

      - name: Sign in to Azure with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI extensions
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --only-show-errors
          az extension add --name cdn --upgrade --only-show-errors

      - name: Enforce Front Door timeout and authentication-safe routing
        env:
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          az afd profile update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --origin-response-timeout-seconds 240 \
            --output none

          timeout="$(
            az afd profile show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --query originResponseTimeoutSeconds \
              --output tsv
          )"
          [[ "$timeout" == "240" ]] || {
            echo "Front Door origin timeout drifted from 240 seconds." >&2
            exit 1
          }

          if [[ "$ACCESS_CONTROL_ENABLED" == "true" ]]; then
            mapfile -t routes < <(
              az afd route list \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --query '[].name' \
                --output tsv
            )
            for route in "${routes[@]}"; do
              az afd route update \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --route-name "$route" \
                --enable-caching false \
                --output none
            done

            az afd origin-group update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --origin-group-name "${{ vars.AZURE_FRONT_DOOR_ORIGIN_GROUP }}" \
              --probe-path /healthz \
              --probe-protocol Https \
              --probe-request-type GET \
              --probe-interval-in-seconds 120 \
              --output none

            cached_routes="$(
              az afd route list \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --query '[?cacheConfiguration!=null].name' \
                --output tsv
            )"
            [[ -z "$cached_routes" ]] || {
              echo "Front Door caching must stay disabled while authentication is enabled." >&2
              exit 1
            }
          fi

      - name: Determine whether to deploy
        id: deployment
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        run: |
          set -Eeuo pipefail
          current_upstream="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.containers[0].env[?name=='UPSTREAM_COMMIT'].value | [0]" \
              --output tsv 2>/dev/null || true
          )"
          current_fork="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.containers[0].env[?name=='CUSTOMIZATION_COMMIT'].value | [0]" \
              --output tsv 2>/dev/null || true
          )"

          should_deploy=false
          if [[ "$FORCE_DEPLOY" == "true" ]]; then
            should_deploy=true
          elif [[ "$current_upstream" != "${{ needs.merge_validate.outputs.upstream_commit }}" || "$current_fork" != "${{ needs.merge_validate.outputs.fork_commit }}" ]]; then
            should_deploy=true
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Read Front Door identifier
        if: steps.deployment.outputs.should_deploy == 'true'
        id: frontdoor
        run: |
          set -Eeuo pipefail
          front_door_id="$(
            az afd profile show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --query frontDoorId \
              --output tsv
          )"
          echo "id=$front_door_id" >> "$GITHUB_OUTPUT"

      - name: Sign in to the shared container registry
        if: steps.deployment.outputs.should_deploy == 'true'
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Set up Docker Buildx
        if: steps.deployment.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Define image tag
        if: steps.deployment.outputs.should_deploy == 'true'
        id: image
        run: |
          timestamp="$(date -u +%Y%m%d%H%M%S)"
          tag="u${{ needs.merge_validate.outputs.upstream_short }}-c${{ needs.merge_validate.outputs.fork_short }}-$timestamp"
          image="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/$IMAGE_REPOSITORY:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push application image
        if: steps.deployment.outputs.should_deploy == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            FRONT_DOOR_ID=${{ steps.frontdoor.outputs.id }}
            VITE_AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}
            VITE_AZURE_OPENAI_DEPLOYMENT_GPT56SOL=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56SOL }}
            VITE_SPEECH_REGION=${{ vars.AZURE_SPEECH_REGION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the new Container Apps revision
        if: steps.deployment.outputs.should_deploy == 'true'
        run: |
          set -Eeuo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          revision_suffix="g${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_vars=(
            "PUBLIC_URL=${{ vars.AZURE_APP_URL }}"
            "ACCESS_CONTROL_ENABLED=${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}"
            "ACCESS_ADMIN_EMAIL=${{ vars.ACCESS_ADMIN_EMAIL }}"
            "AZURE_ACCESS_KEY_VAULT_RESOURCE_ID=${{ vars.AZURE_ACCESS_KEY_VAULT_RESOURCE_ID }}"
            "AZURE_CLIENT_ID=${{ vars.AZURE_RUNTIME_CLIENT_ID }}"
            "AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}"
            "AZURE_OPENAI_ALLOWED_DEPLOYMENTS=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56SOL }}"
            "OPENAI_RATE_LIMIT_PER_HOUR=120"
            "AZURE_SPEECH_REGION=${{ vars.AZURE_SPEECH_REGION }}"
            "AZURE_SPEECH_RESOURCE_ID=${{ vars.AZURE_SPEECH_RESOURCE_ID }}"
            "FEEDBACK_EMAIL_ENDPOINT=${{ vars.FEEDBACK_EMAIL_ENDPOINT }}"
            "FEEDBACK_EMAIL_SENDER=${{ vars.FEEDBACK_EMAIL_SENDER }}"
            "FEEDBACK_EMAIL_RECIPIENT=${{ vars.FEEDBACK_EMAIL_RECIPIENT }}"
            "UPSTREAM_COMMIT=${{ needs.merge_validate.outputs.upstream_commit }}"
            "CUSTOMIZATION_COMMIT=${{ needs.merge_validate.outputs.fork_commit }}"
            "DEPLOYED_AT=$deployed_at"
          )

          if [[ -n "${{ vars.AZURE_TABLES_ENDPOINT }}" ]]; then
            env_vars+=(
              "AZURE_TABLES_ENDPOINT=${{ vars.AZURE_TABLES_ENDPOINT }}"
              "AZURE_TABLES_FEEDBACK_TABLE=${{ vars.AZURE_TABLES_FEEDBACK_TABLE }}"
            )
          fi
          if [[ -n "${{ vars.AZURE_COSMOS_ENDPOINT }}" ]]; then
            env_vars+=(
              "AZURE_COSMOS_ENDPOINT=${{ vars.AZURE_COSMOS_ENDPOINT }}"
              "COSMOS_DATABASE_ID=${{ vars.COSMOS_DATABASE_ID }}"
              "COSMOS_CONTAINER_ID=${{ vars.COSMOS_CONTAINER_ID }}"
              "COSMOS_FEEDBACK_CONTAINER_ID=${{ vars.COSMOS_FEEDBACK_CONTAINER_ID }}"
            )
          fi

          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --image "${{ steps.image.outputs.image }}" \
            --revision-suffix "$revision_suffix" \
            --set-env-vars "${env_vars[@]}" \
            --output none

          for attempt in $(seq 1 60); do
            latest="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --query properties.latestRevisionName \
                --output tsv
            )"
            ready="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --query properties.latestReadyRevisionName \
                --output tsv
            )"
            [[ -n "$latest" && "$latest" == "$ready" ]] && break
            [[ "$attempt" -eq 60 ]] && {
              echo "The new Container Apps revision did not become ready." >&2
              exit 1
            }
            sleep 10
          done

      - name: Purge Front Door cache
        if: steps.deployment.outputs.should_deploy == 'true'
        run: |
          az afd endpoint purge \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
            --content-paths '/*' \
            --output none

      - name: Verify the production endpoint
        if: steps.deployment.outputs.should_deploy == 'true'
        env:
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            headers="$(mktemp)"
            checks_ok=true

            if [[ "$ACCESS_CONTROL_ENABLED" == "true" ]]; then
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 15 \
                --max-time 45 \
                --user-agent 'AzureDiagarm-GitHub-Updater/1.0' \
                --dump-header "$headers" \
                --output /tmp/azurediagarm-health.txt \
                "${{ vars.AZURE_APP_URL }}/healthz"; then
                grep -qx 'ok' /tmp/azurediagarm-health.txt || checks_ok=false
                grep -qi '^x-robots-tag:.*noindex' "$headers" || checks_ok=false
                grep -qi '^referrer-policy:.*no-referrer' "$headers" || checks_ok=false

                root_status="$(
                  curl \
                    --silent \
                    --output /dev/null \
                    --dump-header /tmp/azurediagarm-auth-headers.txt \
                    --write-out '%{http_code}' \
                    --max-redirs 0 \
                    --connect-timeout 15 \
                    --max-time 45 \
                    "${{ vars.AZURE_APP_URL }}/" || true
                )"
                [[ "$root_status" == "302" || "$root_status" == "401" ]] || checks_ok=false
                if [[ "$root_status" == "302" ]]; then
                  grep -qi '^location:.*\.auth/login/aad' /tmp/azurediagarm-auth-headers.txt || checks_ok=false
                fi
              else
                checks_ok=false
              fi
            elif curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 90 \
              --user-agent 'AzureDiagarm-GitHub-Updater/1.0' \
              --dump-header "$headers" \
              --output /tmp/azurediagarm.html \
              "${{ vars.AZURE_APP_URL }}/"; then
              grep -qi '^x-robots-tag:.*noindex' "$headers" || checks_ok=false
              grep -qi '^referrer-policy:.*no-referrer' "$headers" || checks_ok=false
              grep -qi '^permissions-policy:' "$headers" || checks_ok=false
              grep -q 'Azure Architecture Diagram Builder' /tmp/azurediagarm.html || checks_ok=false
            else
              checks_ok=false
            fi

            if [[ "$checks_ok" == "true" ]]; then
              invalid_deployment_status="$(
                curl \
                  --silent \
                  --output /tmp/azurediagarm-openai-check.json \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"apiFormat":"responses","deployment":"not-allowed","body":{"model":"not-allowed","input":[],"max_output_tokens":1}}' \
                  "${{ vars.AZURE_APP_URL }}/api/openai" || true
              )"
              if [[ "$ACCESS_CONTROL_ENABLED" == "true" ]]; then
                [[ "$invalid_deployment_status" == "302" || "$invalid_deployment_status" == "401" || "$invalid_deployment_status" == "403" ]] || checks_ok=false
              else
                [[ "$invalid_deployment_status" == "403" ]] || checks_ok=false
              fi

              origin_fqdn="$(
                az containerapp show \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --name "${{ vars.AZURE_CONTAINER_APP }}" \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv 2>/dev/null || true
              )"
              origin_status="$(
                curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 30 \
                  "https://${origin_fqdn}/" || true
              )"
              if [[ "$ACCESS_CONTROL_ENABLED" == "true" ]]; then
                [[ "$origin_status" == "302" || "$origin_status" == "401" || "$origin_status" == "403" ]] || checks_ok=false
              else
                [[ "$origin_status" == "403" ]] || checks_ok=false
              fi

              mcp_status="$(
                curl \
                  --silent \
                  --output /tmp/azurediagarm-mcp-check.json \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deployment-check","version":"1.0"}}}' \
                  "${{ vars.AZURE_APP_URL }}/mcp" || true
              )"
              if [[ "$ACCESS_CONTROL_ENABLED" == "true" ]]; then
                [[ "$mcp_status" == "302" || "$mcp_status" == "401" || "$mcp_status" == "403" ]] || checks_ok=false
              else
                [[ "$mcp_status" == "401" || "$mcp_status" == "404" ]] || checks_ok=false
              fi

              if [[ "$checks_ok" == "true" ]]; then
                rm -f "$headers"
                exit 0
              fi
            fi
            rm -f "$headers"
            echo "Production verification attempt $attempt failed; retrying." >&2
            sleep 20
          done
          echo "Production verification failed." >&2
          exit 1

      - name: Send detailed update email
        if: steps.deployment.outputs.should_deploy == 'true'
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
        run: |
          set -Eeuo pipefail
          az extension add --name communication --yes --only-show-errors

          {
            echo "Azure Architecture Diagram Builder was updated successfully."
            echo
            echo "URL: ${{ vars.AZURE_APP_URL }}"
            echo "Image: ${{ steps.image.outputs.image }}"
            echo "Upstream commit: ${{ needs.merge_validate.outputs.upstream_commit }}"
            echo "Customization commit: ${{ needs.merge_validate.outputs.fork_commit }}"
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Upstream update details:"
            cat update-details.txt
          } > email-body.txt

          az communication email send \
            --sender "${{ vars.AZURE_EMAIL_SENDER }}" \
            --to "${{ vars.AZURE_EMAIL_RECIPIENT }}" \
            --subject "AzureDiagarm update completed: ${{ needs.merge_validate.outputs.upstream_short }}" \
            --text "$(cat email-body.txt)" \
            --wait-until completed \
            --output none

      - name: Send failure email
        if: failure()
        continue-on-error: true
        env:
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
        run: |
          details="No additional failure details were generated."
          if [[ -s update-details.txt ]]; then
            details="$(cat update-details.txt)"
          fi
          failure_body="$(
            printf 'The AzureDiagarm sync or deployment failed.\n\n%s\n\nWorkflow: %s\n' \
              "$details" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )"
          az extension add --name communication --yes --only-show-errors
          az communication email send \
            --sender "${{ vars.AZURE_EMAIL_SENDER }}" \
            --to "${{ vars.AZURE_EMAIL_RECIPIENT }}" \
            --subject "AzureDiagarm update failed" \
            --text "$failure_body" \
            --wait-until completed \
            --output none
