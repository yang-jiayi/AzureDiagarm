name: AzureDiagarm sync and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even when the source commits have not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: azurediagarm-production
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder.git
  IMAGE_REPOSITORY: azurediagarm/app
  # Workflow logs retain the build result; disposable .dockerbuild artifacts
  # otherwise accumulate on every production deployment.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  # Generated extension command surfaces can change between beta releases.
  AZURE_CONTAINERAPP_EXTENSION_VERSION: 1.3.0b4
  AZURE_CDN_EXTENSION_VERSION: 1.0.0b2

jobs:
  merge_validate:
    name: Merge and validate upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_changed: ${{ steps.source.outputs.source_changed }}
      base_commit: ${{ steps.source.outputs.base_commit }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      fork_commit: ${{ steps.source.outputs.fork_commit }}
      upstream_short: ${{ steps.source.outputs.upstream_short }}
      fork_short: ${{ steps.source.outputs.fork_short }}
      update_details_b64: ${{ steps.source.outputs.update_details_b64 }}
    steps:
      - name: Check out customization fork
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            mcp-server/package-lock.json

      - name: Merge approved upstream source
        id: source
        run: |
          set -Eeuo pipefail
          details_file="$RUNNER_TEMP/update-details.txt"

          git config user.name "azurediagarm-updater"
          git config user.email "azurediagarm-updater@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPOSITORY"

          fork_before="$(git rev-parse HEAD)"
          git fetch upstream main
          upstream_commit="$(git rev-parse upstream/main)"
          merge_base="$(git merge-base HEAD upstream/main)"

          # A customization push must be deployable even when a separate,
          # unreviewed upstream change touches protected files. Manual runs
          # continue through the guarded upstream-sync path below.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            fork_commit="$fork_before"
            {
              echo "source_changed=false"
              echo "base_commit=$fork_before"
              echo "upstream_commit=$merge_base"
              echo "fork_commit=$fork_commit"
              echo "upstream_short=${merge_base:0:12}"
              echo "fork_short=${fork_commit:0:12}"
            } >> "$GITHUB_OUTPUT"
            {
              echo "- Deploying customization commit ${fork_commit:0:12}."
              echo "- Deployed upstream baseline: ${merge_base:0:12}."
              echo "- Latest upstream commit awaiting manual review: ${upstream_commit:0:12}."
              echo "- Upstream synchronization requires a manual workflow dispatch."
            } > "$details_file"
            echo "update_details_b64=$(base64 -w 0 "$details_file")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never auto-merge upstream changes that can alter GitHub credentials,
          # Azure deployment behavior, origin protection, or server-side controls.
          mapfile -t protected_changes < <(
            git diff --name-only "$merge_base..upstream/main" -- \
              .github \
              .dockerignore \
              Dockerfile \
              azure.yaml \
              index.html \
              infra \
              package.json \
              package-lock.json \
              nginx.conf \
              server \
              start.sh \
              public \
              mcp-server \
              scripts \
              vite.config.ts \
              tsconfig.json \
              tsconfig.node.json \
              eslint.config.js \
              blueprint-preview.html
          )
          if (( ${#protected_changes[@]} > 0 )); then
            {
              echo "Upstream changed protected deployment or security files."
              echo "Automatic merge was stopped for manual review."
              echo
              echo "Upstream commit: $upstream_commit"
              echo "Customization commit: $fork_before"
              echo
              echo "Protected files:"
              printf -- '- %s\n' "${protected_changes[@]}"
            } > "$details_file"
            echo "::error::Upstream changed protected deployment or security files. See update-details.txt."
            exit 1
          fi

          if ! git merge --no-ff --no-commit upstream/main; then
            {
              echo "Upstream merge conflict detected."
              echo
              echo "Upstream commit: $upstream_commit"
              echo "Customization commit: $fork_before"
              echo
              echo "Conflicting files:"
              git diff --name-only --diff-filter=U
            } > "$details_file"
            git merge --abort
            echo "::error::Upstream changes conflict with AzureDiagarm customizations. See update-details.txt."
            exit 1
          fi

          if git rev-parse --quiet --verify MERGE_HEAD > /dev/null; then
            fork_epoch="$(git show --no-patch --format=%ct HEAD)"
            upstream_epoch="$(git show --no-patch --format=%ct upstream/main)"
            merge_epoch=$(( (fork_epoch > upstream_epoch ? fork_epoch : upstream_epoch) + 1 ))
            GIT_AUTHOR_DATE="@$merge_epoch +0000" \
            GIT_COMMITTER_DATE="@$merge_epoch +0000" \
              git commit \
                --no-verify \
                --message "Merge approved upstream commit $upstream_commit"
          fi

          fork_commit="$(git rev-parse HEAD)"
          source_changed=false
          if [[ "$fork_before" != "$fork_commit" ]]; then
            source_changed=true
          fi

          {
            echo "source_changed=$source_changed"
            echo "base_commit=$fork_before"
            echo "upstream_commit=$upstream_commit"
            echo "fork_commit=$fork_commit"
            echo "upstream_short=${upstream_commit:0:12}"
            echo "fork_short=${fork_commit:0:12}"
          } >> "$GITHUB_OUTPUT"

          git log \
            --no-merges \
            --date=iso-strict \
            --pretty=format:'- %h %ad %an: %s' \
            "${merge_base}..${upstream_commit}" > "$details_file"

          if [[ ! -s "$details_file" ]]; then
            printf '%s\n' "- No new upstream commits; checking deployment state for customization commit ${fork_commit:0:12}." > "$details_file"
          fi
          echo "update_details_b64=$(base64 -w 0 "$details_file")" >> "$GITHUB_OUTPUT"

      - name: Validate merged source before publishing
        run: |
          set -Eeuo pipefail
          git diff --check
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run build
          npm run lint
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          node --check server/token-server.js
          node --check server/openai-proxy.js
          node --check server/access-control.js
          node --check server/arm-key-vault-access-store.js
          npm --prefix server ci --ignore-scripts
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix server test
          npm --prefix mcp-server ci --ignore-scripts
          npm --prefix mcp-server audit --omit=dev --audit-level=high
          npm --prefix mcp-server run build
          npm --prefix mcp-server test
          git diff --exit-code
          git diff --cached --exit-code

          if [[ "${{ steps.source.outputs.source_changed }}" == "true" ]]; then
            base_commit="${{ steps.source.outputs.base_commit }}"
            expected_commit="${{ steps.source.outputs.fork_commit }}"
            actual_commit="$(/usr/bin/git rev-parse HEAD)"
            [[ "$base_commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$actual_commit" == "$expected_commit" ]]
            /usr/bin/git merge-base --is-ancestor "$base_commit" "$expected_commit"
            [[ -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)" ]]

            bundle_ref="refs/validated/upstream-merge"
            /usr/bin/git update-ref "$bundle_ref" "$expected_commit"
            trap '/usr/bin/git update-ref -d refs/validated/upstream-merge' EXIT
            /usr/bin/git bundle create \
              "$RUNNER_TEMP/validated-upstream-merge.bundle" \
              "$bundle_ref" \
              "^$base_commit"
            /usr/bin/git bundle verify "$RUNNER_TEMP/validated-upstream-merge.bundle"
          fi

      - name: Name validated upstream artifact
        id: artifact
        if: steps.source.outputs.source_changed == 'true'
        run: echo "name=validated-upstream-merge-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload validated upstream merge
        if: steps.source.outputs.source_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/validated-upstream-merge.bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  stage_validated_merge:
    name: Stage validated upstream merge
    needs: merge_validate
    if: needs.merge_validate.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      staged_branch: ${{ steps.stage.outputs.branch }}
    steps:
      - name: Check out trusted publication base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated upstream merge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.merge_validate.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-upstream-merge

      - name: Verify and stage validated commit
        id: stage
        env:
          BASE_COMMIT: ${{ needs.merge_validate.outputs.base_commit }}
          EXPECTED_COMMIT: ${{ needs.merge_validate.outputs.fork_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/validated-upstream-merge/validated-upstream-merge.bundle"
          [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ -f "$bundle" ]]

          /usr/bin/git bundle verify "$bundle"
          /usr/bin/git fetch \
            "$bundle" \
            refs/validated/upstream-merge:refs/remotes/validated/upstream-merge
          bundle_commit="$(
            /usr/bin/git rev-parse \
              --verify refs/remotes/validated/upstream-merge^{commit}
          )"
          [[ "$bundle_commit" == "$EXPECTED_COMMIT" ]]

          /usr/bin/git fetch \
            --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            main:refs/remotes/origin/main
          current_main="$(/usr/bin/git rev-parse refs/remotes/origin/main)"
          [[ "$current_main" == "$BASE_COMMIT" || "$current_main" == "$EXPECTED_COMMIT" ]]

          staged_branch="automation/upstream-sync"
          staged_ref="refs/heads/$staged_branch"
          existing_commit="$(
            /usr/bin/git ls-remote \
              --heads \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "$staged_ref" \
              | awk '{ print $1 }'
          )"
          push_args=()
          if [[ -n "$existing_commit" ]]; then
            [[ "$existing_commit" =~ ^[0-9a-f]{40}$ ]]
            push_args+=(--force-with-lease="$staged_ref:$existing_commit")
          fi
          /usr/bin/git push \
            "${push_args[@]}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$EXPECTED_COMMIT:$staged_ref"
          echo "branch=$staged_branch" >> "$GITHUB_OUTPUT"

  publish_validated_merge:
    name: Publish validated upstream merge
    needs:
      - merge_validate
      - stage_validated_merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated upstream commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.merge_validate.outputs.fork_commit }}
          fetch-depth: 0
          ssh-key: ${{ secrets.MAIN_BRANCH_DEPLOY_KEY }}
          persist-credentials: true

      - name: Publish validated commit to main
        env:
          BASE_COMMIT: ${{ needs.merge_validate.outputs.base_commit }}
          EXPECTED_COMMIT: ${{ needs.merge_validate.outputs.fork_commit }}
          STAGED_BRANCH: ${{ needs.stage_validated_merge.outputs.staged_branch }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGED_BRANCH" == "automation/upstream-sync" ]]
          [[ "$(/usr/bin/git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]

          /usr/bin/git fetch origin "refs/heads/main:refs/remotes/origin/main"
          current_main="$(
            /usr/bin/git rev-parse --verify refs/remotes/origin/main^{commit}
          )"
          staged_commit="$(
            /usr/bin/git ls-remote \
              --heads origin "refs/heads/$STAGED_BRANCH" \
              | awk '{ print $1 }'
          )"

          if [[ "$current_main" == "$EXPECTED_COMMIT" ]]; then
            if [[ -n "$staged_commit" ]]; then
              [[ "$staged_commit" == "$EXPECTED_COMMIT" ]]
              /usr/bin/git push origin ":refs/heads/$STAGED_BRANCH"
            fi
            exit 0
          fi

          [[ "$current_main" == "$BASE_COMMIT" ]]
          [[ "$staged_commit" == "$EXPECTED_COMMIT" ]]
          /usr/bin/git push \
            --atomic \
            origin \
            "$EXPECTED_COMMIT:refs/heads/main" \
            ":refs/heads/$STAGED_BRANCH"

  notify_validation_failure:
    name: Notify synchronization failure
    needs:
      - merge_validate
      - stage_validated_merge
      - publish_validated_merge
    if: ${{ always() && (needs.merge_validate.result == 'failure' || needs.stage_validated_merge.result == 'failure' || needs.publish_validated_merge.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out notification helper
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Send validation failure email
        env:
          AZURE_COMMUNICATION_ENDPOINT: ${{ vars.FEEDBACK_EMAIL_ENDPOINT }}
          AZURE_EMAIL_SENDER: ${{ vars.AZURE_EMAIL_SENDER }}
          AZURE_EMAIL_RECIPIENT: ${{ vars.AZURE_EMAIL_RECIPIENT }}
          AZURE_EMAIL_SUBJECT: AzureDiagarm update validation or publication failed
        run: |
          set -Eeuo pipefail
          printf 'The AzureDiagarm upstream merge, validation, or publication failed.\n\nWorkflow: %s\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > email-body.txt
          bash scripts/send-acs-email.sh email-body.txt

  deploy:
    name: Deploy validated revision
    needs: merge_validate
    if: needs.merge_validate.outputs.source_changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.merge_validate.outputs.fork_commit }}
          persist-credentials: false

      - name: Restore update details
        run: |
          printf '%s' "${{ needs.merge_validate.outputs.update_details_b64 }}" \
            | base64 --decode > update-details.txt

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI extensions
        run: |
          set -Eeuo pipefail

          install_extension() {
            local name="$1"
            local version="$2"
            local installed

            installed="$(
              az extension show \
                --name "$name" \
                --query version \
                --output tsv 2>/dev/null || true
            )"
            if [[ -n "$installed" && "$installed" != "$version" ]]; then
              az extension remove --name "$name" --only-show-errors
              installed=
            fi
            if [[ -z "$installed" ]]; then
              az extension add \
                --name "$name" \
                --version "$version" \
                --only-show-errors
            fi

            installed="$(
              az extension show \
                --name "$name" \
                --query version \
                --output tsv
            )"
            [[ "$installed" == "$version" ]] || {
              echo "::error::Azure CLI extension $name version $installed does not match required version $version."
              exit 1
            }
          }

          install_extension containerapp "$AZURE_CONTAINERAPP_EXTENSION_VERSION"
          install_extension cdn "$AZURE_CDN_EXTENSION_VERSION"

      - name: Enforce Front Door timeout and authentication-safe routing
        env:
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          az afd profile update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --origin-response-timeout-seconds 240 \
            --output none

          timeout="$(
            az afd profile show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --query originResponseTimeoutSeconds \
              --output tsv
          )"
          [[ "$timeout" == "240" ]] || {
            echo "Front Door origin timeout drifted from 240 seconds." >&2
            exit 1
          }

          easy_auth_enabled="$(
            az containerapp auth show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query platform.enabled \
              --output tsv
          )"
          [[ "$easy_auth_enabled" == "true" || "$easy_auth_enabled" == "false" ]] || {
            echo "::error::Could not determine whether Container Apps authentication is enabled."
            exit 1
          }

          if [[ "$ACCESS_CONTROL_ENABLED" == "true" || "$easy_auth_enabled" == "true" ]]; then
            routes_output="$(
              az afd route list \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --query '[].name' \
                --output tsv
            )"
            [[ -n "$routes_output" ]] || {
              echo "::error::No Front Door routes were found for the configured endpoint."
              exit 1
            }
            mapfile -t routes <<< "$routes_output"

            for route in "${routes[@]}"; do
              az afd route update \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --route-name "$route" \
                --remove cacheConfiguration \
                --output none
            done

            az afd origin-group update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --origin-group-name "${{ vars.AZURE_FRONT_DOOR_ORIGIN_GROUP }}" \
              --probe-path /healthz \
              --probe-protocol Https \
              --probe-request-type GET \
              --probe-interval-in-seconds 120 \
              --output none

            cached_routes="$(
              az afd route list \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
                --query '[?cacheConfiguration!=null].name' \
                --output tsv
            )"
            [[ -z "$cached_routes" ]] || {
              echo "Front Door caching must stay disabled while authentication is enabled." >&2
              exit 1
            }
          fi

      - name: Enforce origin isolation and Front Door diagnostics
        shell: pwsh
        run: |
          ./scripts/enforce-frontdoor-origin-security.ps1 `
            -SubscriptionId '${{ vars.AZURE_SUBSCRIPTION_ID }}' `
            -ResourceGroup '${{ vars.AZURE_RESOURCE_GROUP }}' `
            -ContainerApp '${{ vars.AZURE_CONTAINER_APP }}' `
            -FrontDoorProfile '${{ vars.AZURE_FRONT_DOOR_PROFILE }}'

      - name: Verify isolated Front Door route
        run: |
          set -Eeuo pipefail
          origin_fqdn="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv
          )"
          front_door_id="$(
            az afd profile show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --query frontDoorId \
              --output tsv
          )"

          health_status=000
          for attempt in $(seq 1 18); do
            health_status="$(
              curl \
                --silent \
                --output /tmp/azurediagarm-security-health.txt \
                --write-out '%{http_code}' \
                --connect-timeout 15 \
                --max-time 45 \
                "${{ vars.AZURE_APP_URL }}/healthz" || true
            )"
            if [[ "$health_status" == "200" ]] && grep -qx 'ok' /tmp/azurediagarm-security-health.txt; then
              break
            fi
            [[ "$attempt" -lt 18 ]] && sleep 10
          done
          [[ "$health_status" == "200" ]]
          grep -qx 'ok' /tmp/azurediagarm-security-health.txt

          spoofed_origin_status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 15 \
              --max-time 30 \
              --header "X-Azure-FDID: $front_door_id" \
              "https://${origin_fqdn}/healthz" || true
          )"
          [[ "$spoofed_origin_status" == "403" ]]

      - name: Verify authentication, WAF, and TLS security baseline
        env:
          APP_URL: ${{ vars.AZURE_APP_URL }}
          ENTRA_CLIENT_ID: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -Eeuo pipefail
          expected_issuer="https://login.microsoftonline.com/${TENANT_ID}/v2.0"

          az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --output json > /tmp/azurediagarm-auth.json

          jq -e \
            --arg client "$ENTRA_CLIENT_ID" \
            --arg issuer "$expected_issuer" \
            '
              .platform.enabled == true and
              .httpSettings.requireHttps == true and
              .globalValidation.unauthenticatedClientAction == "RedirectToLoginPage" and
              .globalValidation.redirectToProvider == "azureactivedirectory" and
              (.globalValidation.excludedPaths | index("/healthz") != null) and
              .identityProviders.azureActiveDirectory.registration.clientId == $client and
              .identityProviders.azureActiveDirectory.registration.openIdIssuer == $issuer and
              (.identityProviders.azureActiveDirectory.validation.allowedAudiences | index($client) != null) and
              (.identityProviders.azureActiveDirectory.validation.allowedAudiences | index("api://" + $client) != null)
            ' /tmp/azurediagarm-auth.json > /dev/null

          app_host="${APP_URL#https://}"
          az afd custom-domain list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --output json > /tmp/azurediagarm-custom-domain.json
          custom_domain_id="$(
            jq -er \
              --arg host "$app_host" \
              '
                map(select(
                  .hostName == $host and
                  .domainValidationState == "Approved" and
                  .provisioningState == "Succeeded" and
                  .tlsSettings.minimumTlsVersion == "TLS12" and
                  .tlsSettings.certificateType == "CustomerCertificate"
                )) |
                first |
                .id
              ' /tmp/azurediagarm-custom-domain.json
          )"

          az afd security-policy list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --output json > /tmp/azurediagarm-security-policy.json
          waf_policy_id="$(
            jq -er \
              --arg domain "$custom_domain_id" \
              '
                map(select(
                  .provisioningState == "Succeeded" and
                  .parameters.type == "WebApplicationFirewall" and
                  any(.parameters.associations[]?.domains[]?;
                    .isActive == true and
                    (.id | ascii_downcase) == ($domain | ascii_downcase)
                  )
                )) |
                first |
                .parameters.wafPolicy.id
              ' /tmp/azurediagarm-security-policy.json
          )"

          az resource show \
            --ids "$waf_policy_id" \
            --output json > /tmp/azurediagarm-waf-policy.json
          jq -e '
            .properties.policySettings.enabledState == "Enabled" and
            .properties.policySettings.mode == "Prevention" and
            .properties.provisioningState == "Succeeded"
          ' /tmp/azurediagarm-waf-policy.json > /dev/null

      - name: Enforce storage security and verify runtime least privilege
        env:
          AZURE_BLOB_ENDPOINT: ${{ vars.AZURE_BLOB_ENDPOINT }}
          AZURE_TABLES_ENDPOINT: ${{ vars.AZURE_TABLES_ENDPOINT }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$AZURE_BLOB_ENDPOINT" ]]; then
            echo "::error::AZURE_BLOB_ENDPOINT is required for durable diagram storage."
            exit 1
          fi
          if [[ -z "$AZURE_TABLES_ENDPOINT" ]]; then
            echo "::error::AZURE_TABLES_ENDPOINT is required so rate limits are shared across Container Apps replicas."
            exit 1
          fi

          normalized_endpoint="${AZURE_TABLES_ENDPOINT%/}/"
          normalized_blob_endpoint="${AZURE_BLOB_ENDPOINT%/}/"
          az storage account list --output json > /tmp/azurediagarm-storage-accounts.json
          storage_id="$(
            jq -er \
              --arg endpoint "${normalized_endpoint,,}" \
              '
                map(select(
                  ((.primaryEndpoints.table // "") | ascii_downcase) == $endpoint
                )) |
                first |
                .id
              ' /tmp/azurediagarm-storage-accounts.json
          )"
          jq -e \
            --arg storage "$storage_id" \
            --arg endpoint "${normalized_blob_endpoint,,}" \
            '
              any(
                .[];
                (.id | ascii_downcase) == ($storage | ascii_downcase) and
                ((.primaryEndpoints.blob // "") | ascii_downcase) == $endpoint
              )
            ' /tmp/azurediagarm-storage-accounts.json > /dev/null || {
            echo "::error::AZURE_BLOB_ENDPOINT and AZURE_TABLES_ENDPOINT must use the same hardened storage account."
            exit 1
          }

          az storage account show \
            --ids "$storage_id" \
            --output json > /tmp/azurediagarm-storage-security.json
          jq -e '
            .publicNetworkAccess == "SecuredByPerimeter" and
            .allowSharedKeyAccess == false and
            .allowBlobPublicAccess == false and
            .enableHttpsTrafficOnly == true and
            .minimumTlsVersion == "TLS1_2"
          ' /tmp/azurediagarm-storage-security.json > /dev/null || {
            echo "::error::Diagram storage must remain secured by its Network Security Perimeter with keyless HTTPS-only access."
            exit 1
          }

          # The storage account uses a Network Security Perimeter instead of a
          # Private Endpoint. Explicitly override the subscription Defender
          # setting so inherited on-upload malware scanning cannot repeatedly
          # attempt an Event Grid subscription that the perimeter blocks.
          defender_url="https://management.azure.com${storage_id}/providers/Microsoft.Security/defenderForStorageSettings/current?api-version=2022-12-01-preview"
          az rest \
            --method get \
            --url "$defender_url" \
            --output json > /tmp/azurediagarm-defender-storage.json
          if ! jq -e '
            .properties.isEnabled == true and
            .properties.overrideSubscriptionLevelSettings == true and
            .properties.malwareScanning.onUpload.isEnabled == false and
            .properties.malwareScanning.onUpload.capGBPerMonth == -1 and
            .properties.sensitiveDataDiscovery.isEnabled == true
          ' /tmp/azurediagarm-defender-storage.json > /dev/null; then
            jq -n '{
              properties: {
                isEnabled: true,
                overrideSubscriptionLevelSettings: true,
                malwareScanning: {
                  onUpload: {
                    isEnabled: false,
                    capGBPerMonth: -1
                  }
                },
                sensitiveDataDiscovery: {
                  isEnabled: true
                }
              }
            }' > /tmp/azurediagarm-defender-storage-desired.json
            az rest \
              --method put \
              --url "$defender_url" \
              --headers Content-Type=application/json \
              --body @/tmp/azurediagarm-defender-storage-desired.json \
              --output json > /tmp/azurediagarm-defender-storage.json
          fi
          jq -e '
            .properties.isEnabled == true and
            .properties.overrideSubscriptionLevelSettings == true and
            .properties.malwareScanning.onUpload.isEnabled == false and
            .properties.sensitiveDataDiscovery.isEnabled == true
          ' /tmp/azurediagarm-defender-storage.json > /dev/null

          # Security Center's built-in Private Link and VNet-rule audits do not
          # recognize Network Security Perimeters. Keep the resource-scoped,
          # time-bound mitigated exemption explicit and fail when it expires.
          az policy exemption show \
            --name AzureDiagarm-Storage-NSP \
            --scope "$storage_id" \
            --output json > /tmp/azurediagarm-storage-policy-exemption.json
          jq -e '
            .exemptionCategory == "Mitigated" and
            (.expiresOn // "") != ""
          ' /tmp/azurediagarm-storage-policy-exemption.json > /dev/null
          exemption_expires="$(
            jq -er '.expiresOn' /tmp/azurediagarm-storage-policy-exemption.json
          )"
          if (( $(date -u -d "$exemption_expires" +%s) <= $(date -u +%s) )); then
            echo "::error::AzureDiagarm-Storage-NSP has expired and requires a security review."
            exit 1
          fi
          required_policy_references=(
            storageaccountsshouldrestrictnetworkaccessusingvirtualnetworkrulesexdatabricksmonitoringeffect
            storageaccountsshouldrestrictnetworkaccessusingvirtualnetworkrulesexaromonitoringeffect
            storageaccountsshouldrestrictnetworkaccessusingvirtualnetworkrulesmonitoringeffect
            storageaccountshoulduseaprivatelinkconnectionexdatabricksmonitoringeffect
            storageaccountshoulduseaprivatelinkconnectionmonitoringeffect
            storageaccountshoulduseaprivatelinkconnectionexaromonitoringeffect
          )
          for reference_id in "${required_policy_references[@]}"; do
            jq -e --arg reference "$reference_id" '
              (.policyDefinitionReferenceIds // []) | index($reference) != null
            ' /tmp/azurediagarm-storage-policy-exemption.json > /dev/null || {
              echo "::error::AzureDiagarm-Storage-NSP is missing policy reference $reference_id."
              exit 1
            }
          done

          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --output json > /tmp/azurediagarm-runtime-app.json
          principal_id="$(
            jq -er '
              .identity.userAssignedIdentities |
              to_entries |
              first |
              .value.principalId
            ' /tmp/azurediagarm-runtime-app.json
          )"
          [[ -n "$principal_id" ]]

          jq -e '
            all(
              .properties.template.containers[].env[]?;
              .name != "AZURE_IMPORT_ENABLED" or
              (((.value // "") | ascii_downcase) != "true")
            )
          ' /tmp/azurediagarm-runtime-app.json > /dev/null || {
            echo "::error::AZURE_IMPORT_ENABLED must remain disabled in production."
            exit 1
          }

          az role assignment list \
            --assignee-object-id "$principal_id" \
            --all \
            --output json > /tmp/azurediagarm-runtime-roles.json
          jq -e --arg storage "$storage_id" '
            any(
              .[];
              .roleDefinitionName == "Storage Table Data Contributor" and
              (
                (.scope | ascii_downcase) as $scope |
                (($storage | ascii_downcase) | startswith($scope))
              )
            )
          ' /tmp/azurediagarm-runtime-roles.json > /dev/null || {
            echo "::error::The Container App identity requires Storage Table Data Contributor on $storage_id."
            exit 1
          }
          jq -e '
            any(
              .[];
              .roleDefinitionName == "Owner" or
              .roleDefinitionName == "Contributor" or
              .roleDefinitionName == "User Access Administrator"
            ) |
            not
          ' /tmp/azurediagarm-runtime-roles.json > /dev/null || {
            echo "::error::The runtime identity has a broad management-plane role. Assign only resource-specific runtime roles."
            exit 1
          }

      - name: Read Front Door identifier
        id: frontdoor
        run: |
          set -Eeuo pipefail
          front_door_id="$(
            az afd profile show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
              --query frontDoorId \
              --output tsv
          )"
          echo "id=$front_door_id" >> "$GITHUB_OUTPUT"

      - name: Validate mandatory runtime configuration
        env:
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
          ACCESS_ADMIN_EMAIL: ${{ vars.ACCESS_ADMIN_EMAIL }}
          AZURE_ACCESS_KEY_VAULT_RESOURCE_ID: ${{ vars.AZURE_ACCESS_KEY_VAULT_RESOURCE_ID }}
          PUBLIC_URL: ${{ vars.AZURE_APP_URL }}
        run: |
          set -Eeuo pipefail
          shopt -s nocasematch
          if [[ "$ACCESS_CONTROL_ENABLED" != "true" ]]; then
            exit 0
          fi
          [[ "$ACCESS_ADMIN_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || {
            echo "::error::ACCESS_ADMIN_EMAIL must be a valid email when access control is enabled."
            exit 1
          }
          [[ "$PUBLIC_URL" =~ ^https://[^/[:space:]]+/?$ ]] || {
            echo "::error::AZURE_APP_URL must be an HTTPS origin when access control is enabled."
            exit 1
          }
          [[ "$AZURE_ACCESS_KEY_VAULT_RESOURCE_ID" =~ ^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+$ ]] || {
            echo "::error::AZURE_ACCESS_KEY_VAULT_RESOURCE_ID must identify the production Key Vault."
            exit 1
          }

      - name: Compute desired deployment configuration
        id: desired_config
        env:
          CONFIG_SCHEMA: '4'
          FRONT_DOOR_ID: ${{ steps.frontdoor.outputs.id }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          PUBLIC_URL: ${{ vars.AZURE_APP_URL }}
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
          ACCESS_ADMIN_EMAIL: ${{ vars.ACCESS_ADMIN_EMAIL }}
          AZURE_ACCESS_KEY_VAULT_RESOURCE_ID: ${{ vars.AZURE_ACCESS_KEY_VAULT_RESOURCE_ID }}
          AZURE_RUNTIME_CLIENT_ID: ${{ vars.AZURE_RUNTIME_CLIENT_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          ALLOW_BYO_AI_ENDPOINTS: 'true'
          AZURE_OPENAI_DEPLOYMENT_GPT56SOL: ${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56SOL }}
          AZURE_OPENAI_DEPLOYMENT_GPT56TERRA: ${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56TERRA }}
          AZURE_OPENAI_DEPLOYMENT_GPT56LUNA: ${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56LUNA }}
          AZURE_FOUNDRY_ENDPOINT: ${{ vars.AZURE_FOUNDRY_ENDPOINT }}
          AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5: ${{ vars.AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5 }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_RESOURCE_ID: ${{ vars.AZURE_SPEECH_RESOURCE_ID }}
          AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          AZURE_AD_AUTHORITY: ${{ vars.AZURE_AD_AUTHORITY }}
          ARM_SCOPE: ${{ vars.ARM_SCOPE }}
          FEEDBACK_EMAIL_ENDPOINT: ${{ vars.FEEDBACK_EMAIL_ENDPOINT }}
          FEEDBACK_EMAIL_SENDER: ${{ vars.FEEDBACK_EMAIL_SENDER }}
          FEEDBACK_EMAIL_RECIPIENT: ${{ vars.FEEDBACK_EMAIL_RECIPIENT }}
          FEEDBACK_CONTACT_ENABLED: ${{ vars.FEEDBACK_CONTACT_ENABLED || 'false' }}
          AZURE_TABLES_ENDPOINT: ${{ vars.AZURE_TABLES_ENDPOINT }}
          AZURE_TABLES_FEEDBACK_TABLE: ${{ vars.AZURE_TABLES_FEEDBACK_TABLE || 'feedback' }}
          AZURE_TABLES_RATE_LIMIT_TABLE: ${{ vars.AZURE_TABLES_RATE_LIMIT_TABLE || 'ratelimit' }}
          AZURE_COSMOS_ENDPOINT: ${{ vars.AZURE_COSMOS_ENDPOINT }}
          COSMOS_DATABASE_ID: ${{ vars.COSMOS_DATABASE_ID }}
          COSMOS_CONTAINER_ID: ${{ vars.COSMOS_CONTAINER_ID }}
          COSMOS_FEEDBACK_CONTAINER_ID: ${{ vars.COSMOS_FEEDBACK_CONTAINER_ID }}
          AZURE_BLOB_ENDPOINT: ${{ vars.AZURE_BLOB_ENDPOINT }}
          AZURE_BLOB_DIAGRAMS_CONTAINER: ${{ vars.AZURE_BLOB_DIAGRAMS_CONTAINER || 'diagrams' }}
          OPENAI_RATE_LIMIT_PER_HOUR: '120'
          MCP_ENABLED: ${{ vars.MCP_ENABLED || 'false' }}
          MCP_HTTP_STATELESS: 'true'
          MCP_HTTP_MAX_IN_FLIGHT: '20'
          MCP_SESSION_MAX: '100'
          MCP_SESSION_IDLE_SECONDS: '1800'
          MCP_SESSION_TTL_SECONDS: '7200'
          MCP_SESSION_GC_SECONDS: '60'
          MIN_REPLICAS: '1'
          MAX_REPLICAS: '2'
          HTTP_SCALE_CONCURRENCY: '50'
          PROBE_PROFILE: 'startup-readyz,liveness-healthz,readiness-readyz'
        run: |
          set -Eeuo pipefail
          keys=(
            CONFIG_SCHEMA FRONT_DOOR_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP
            AZURE_CONTAINER_REGISTRY PUBLIC_URL ACCESS_CONTROL_ENABLED ACCESS_ADMIN_EMAIL
            AZURE_ACCESS_KEY_VAULT_RESOURCE_ID AZURE_RUNTIME_CLIENT_ID
            AZURE_OPENAI_ENDPOINT ALLOW_BYO_AI_ENDPOINTS AZURE_OPENAI_DEPLOYMENT_GPT56SOL
            AZURE_OPENAI_DEPLOYMENT_GPT56TERRA AZURE_OPENAI_DEPLOYMENT_GPT56LUNA
            AZURE_FOUNDRY_ENDPOINT AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5
            AZURE_SPEECH_REGION AZURE_SPEECH_RESOURCE_ID AZURE_AD_CLIENT_ID
            AZURE_AD_AUTHORITY ARM_SCOPE FEEDBACK_EMAIL_ENDPOINT FEEDBACK_EMAIL_SENDER
            FEEDBACK_EMAIL_RECIPIENT FEEDBACK_CONTACT_ENABLED
            AZURE_TABLES_ENDPOINT AZURE_TABLES_FEEDBACK_TABLE
            AZURE_TABLES_RATE_LIMIT_TABLE AZURE_COSMOS_ENDPOINT COSMOS_DATABASE_ID
            COSMOS_CONTAINER_ID COSMOS_FEEDBACK_CONTAINER_ID AZURE_BLOB_ENDPOINT
            AZURE_BLOB_DIAGRAMS_CONTAINER OPENAI_RATE_LIMIT_PER_HOUR MCP_ENABLED
            MCP_HTTP_STATELESS MCP_HTTP_MAX_IN_FLIGHT MCP_SESSION_MAX MCP_SESSION_IDLE_SECONDS
            MCP_SESSION_TTL_SECONDS MCP_SESSION_GC_SECONDS MIN_REPLICAS MAX_REPLICAS
            HTTP_SCALE_CONCURRENCY PROBE_PROFILE
          )
          desired_hash="$(
            for key in "${keys[@]}"; do
              printf '%s=%s\0' "$key" "${!key-}"
            done | sha256sum | cut -d' ' -f1
          )"
          echo "hash=$desired_hash" >> "$GITHUB_OUTPUT"

          runtime_env=(
            "PUBLIC_URL=$PUBLIC_URL"
            "ACCESS_CONTROL_ENABLED=$ACCESS_CONTROL_ENABLED"
            "ACCESS_ADMIN_EMAIL=$ACCESS_ADMIN_EMAIL"
            "AZURE_ACCESS_KEY_VAULT_RESOURCE_ID=$AZURE_ACCESS_KEY_VAULT_RESOURCE_ID"
            "AZURE_CLIENT_ID=$AZURE_RUNTIME_CLIENT_ID"
            "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT"
            "AZURE_OPENAI_ALLOWED_DEPLOYMENTS=$AZURE_OPENAI_DEPLOYMENT_GPT56SOL,$AZURE_OPENAI_DEPLOYMENT_GPT56TERRA,$AZURE_OPENAI_DEPLOYMENT_GPT56LUNA"
            "ALLOW_BYO_AI_ENDPOINTS=$ALLOW_BYO_AI_ENDPOINTS"
            "AZURE_FOUNDRY_ENDPOINT=$AZURE_FOUNDRY_ENDPOINT"
            "AZURE_FOUNDRY_ALLOWED_DEPLOYMENTS=$AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5"
            "OPENAI_RATE_LIMIT_PER_HOUR=$OPENAI_RATE_LIMIT_PER_HOUR"
            "AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION"
            "AZURE_SPEECH_RESOURCE_ID=$AZURE_SPEECH_RESOURCE_ID"
            "MCP_ENABLED=$MCP_ENABLED"
            "MCP_HTTP_STATELESS=$MCP_HTTP_STATELESS"
            "MCP_HTTP_MAX_IN_FLIGHT=$MCP_HTTP_MAX_IN_FLIGHT"
            "MCP_SESSION_MAX=$MCP_SESSION_MAX"
            "MCP_SESSION_IDLE_SECONDS=$MCP_SESSION_IDLE_SECONDS"
            "MCP_SESSION_TTL_SECONDS=$MCP_SESSION_TTL_SECONDS"
            "MCP_SESSION_GC_SECONDS=$MCP_SESSION_GC_SECONDS"
            "FEEDBACK_EMAIL_ENDPOINT=$FEEDBACK_EMAIL_ENDPOINT"
            "FEEDBACK_EMAIL_SENDER=$FEEDBACK_EMAIL_SENDER"
            "FEEDBACK_EMAIL_RECIPIENT=$FEEDBACK_EMAIL_RECIPIENT"
            "FEEDBACK_CONTACT_ENABLED=$FEEDBACK_CONTACT_ENABLED"
          )
          absent_env=(AZURE_OPENAI_API_KEY AZURE_FOUNDRY_API_KEY)
          if [[ -n "$AZURE_TABLES_ENDPOINT" ]]; then
            runtime_env+=(
              "AZURE_TABLES_ENDPOINT=$AZURE_TABLES_ENDPOINT"
              "AZURE_TABLES_FEEDBACK_TABLE=$AZURE_TABLES_FEEDBACK_TABLE"
              "AZURE_TABLES_RATE_LIMIT_TABLE=$AZURE_TABLES_RATE_LIMIT_TABLE"
            )
          else
            absent_env+=(AZURE_TABLES_ENDPOINT AZURE_TABLES_FEEDBACK_TABLE AZURE_TABLES_RATE_LIMIT_TABLE)
          fi
          if [[ -n "$AZURE_COSMOS_ENDPOINT" ]]; then
            runtime_env+=(
              "AZURE_COSMOS_ENDPOINT=$AZURE_COSMOS_ENDPOINT"
              "COSMOS_DATABASE_ID=$COSMOS_DATABASE_ID"
              "COSMOS_CONTAINER_ID=$COSMOS_CONTAINER_ID"
              "COSMOS_FEEDBACK_CONTAINER_ID=$COSMOS_FEEDBACK_CONTAINER_ID"
            )
          else
            absent_env+=(AZURE_COSMOS_ENDPOINT COSMOS_DATABASE_ID COSMOS_CONTAINER_ID COSMOS_FEEDBACK_CONTAINER_ID)
          fi
          if [[ -n "$AZURE_BLOB_ENDPOINT" ]]; then
            runtime_env+=(
              "AZURE_BLOB_ENDPOINT=$AZURE_BLOB_ENDPOINT"
              "AZURE_BLOB_DIAGRAMS_CONTAINER=$AZURE_BLOB_DIAGRAMS_CONTAINER"
            )
          else
            absent_env+=(AZURE_BLOB_ENDPOINT AZURE_BLOB_DIAGRAMS_CONTAINER)
          fi
          echo "runtime_env_b64=$(printf '%s\0' "${runtime_env[@]}" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "absent_env_b64=$(printf '%s\0' "${absent_env[@]}" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Determine whether to deploy
        id: deployment
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
          DESIRED_CONFIG_HASH: ${{ steps.desired_config.outputs.hash }}
        run: |
          set -Eeuo pipefail
          current_upstream="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.containers[0].env[?name=='UPSTREAM_COMMIT'].value | [0]" \
              --output tsv 2>/dev/null || true
          )"
          current_fork="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.containers[0].env[?name=='CUSTOMIZATION_COMMIT'].value | [0]" \
              --output tsv 2>/dev/null || true
          )"
          current_config_hash="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.containers[0].env[?name=='DESIRED_CONFIG_HASH'].value | [0]" \
              --output tsv 2>/dev/null || true
          )"
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query properties.template.containers[0].env \
            --output json > /tmp/azurediagarm-current-env.json
          mapfile -d '' desired_runtime_env < <(
            printf '%s' "${{ steps.desired_config.outputs.runtime_env_b64 }}" | base64 --decode
          )
          mapfile -d '' absent_runtime_env < <(
            printf '%s' "${{ steps.desired_config.outputs.absent_env_b64 }}" | base64 --decode
          )
          runtime_env_matches=true
          for entry in "${desired_runtime_env[@]}"; do
            name="${entry%%=*}"
            expected="${entry#*=}"
            actual="$(
              jq -r --arg name "$name" '
                [.[] | select(.name == $name)][0]
                | if . == null then "__MISSING__"
                  elif .secretRef then "secretref:" + .secretRef
                  else (.value // "")
                  end
              ' /tmp/azurediagarm-current-env.json
            )"
            if [[ "$actual" != "$expected" ]]; then
              echo "Runtime environment drift: $name does not match the desired value." >&2
              runtime_env_matches=false
            fi
          done
          for name in "${absent_runtime_env[@]}"; do
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' \
              /tmp/azurediagarm-current-env.json > /dev/null; then
              echo "Runtime environment drift: stale $name is still configured." >&2
              runtime_env_matches=false
            fi
          done
          current_min_replicas="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query properties.template.scale.minReplicas \
              --output tsv
          )"
          current_max_replicas="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query properties.template.scale.maxReplicas \
              --output tsv
          )"
          current_http_concurrency="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query "properties.template.scale.rules[?name=='http'].http.metadata.concurrentRequests | [0]" \
              --output tsv
          )"
          scale_matches=false
          if [[ "$current_min_replicas" == "1" && "$current_max_replicas" == "2" && "$current_http_concurrency" == "50" ]]; then
            scale_matches=true
          fi
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query properties.template.containers[0].probes \
            --output json > /tmp/azurediagarm-current-probes.json
          probes_match=false
          if jq -e --arg frontDoorId "${{ steps.frontdoor.outputs.id }}" '
            length == 3 and
            any(.[];
              .type == "Startup" and
              .httpGet.path == "/readyz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            ) and
            any(.[];
              .type == "Liveness" and
              .httpGet.path == "/healthz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            ) and
            any(.[];
              .type == "Readiness" and
              .httpGet.path == "/readyz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            )
          ' /tmp/azurediagarm-current-probes.json > /dev/null; then
            probes_match=true
          fi
          current_secret_names="$(
            az containerapp secret list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query '[].name' \
              --output tsv
          )"
          stale_ai_credentials=false
          for name in azure-openai-api-key azure-foundry-api-key; do
            if grep -qx "$name" <<< "$current_secret_names"; then
              stale_ai_credentials=true
            fi
          done

          should_deploy=false
          if [[ "$FORCE_DEPLOY" == "true" ]]; then
            should_deploy=true
          elif [[ "$current_upstream" != "${{ needs.merge_validate.outputs.upstream_commit }}" || "$current_fork" != "${{ needs.merge_validate.outputs.fork_commit }}" || "$current_config_hash" != "$DESIRED_CONFIG_HASH" || "$runtime_env_matches" != "true" || "$scale_matches" != "true" || "$probes_match" != "true" || "$stale_ai_credentials" == "true" ]]; then
            should_deploy=true
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Sign in to the shared container registry
        if: steps.deployment.outputs.should_deploy == 'true'
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Set up Docker Buildx
        if: steps.deployment.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image tag
        if: steps.deployment.outputs.should_deploy == 'true'
        id: image
        run: |
          timestamp="$(date -u +%Y%m%d%H%M%S)"
          tag="u${{ needs.merge_validate.outputs.upstream_short }}-c${{ needs.merge_validate.outputs.fork_short }}-$timestamp"
          image="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/$IMAGE_REPOSITORY:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push application image
        if: steps.deployment.outputs.should_deploy == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            FRONT_DOOR_ID=${{ steps.frontdoor.outputs.id }}
            VITE_AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}
            VITE_AZURE_OPENAI_DEPLOYMENT_GPT56SOL=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56SOL }}
            VITE_AZURE_OPENAI_DEPLOYMENT_GPT56TERRA=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56TERRA }}
            VITE_AZURE_OPENAI_DEPLOYMENT_GPT56LUNA=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56LUNA }}
            VITE_AZURE_FOUNDRY_ENDPOINT=${{ vars.AZURE_FOUNDRY_ENDPOINT }}
            VITE_AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5=${{ vars.AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5 }}
            VITE_SPEECH_REGION=${{ vars.AZURE_SPEECH_REGION }}
            VITE_AZURE_AD_CLIENT_ID=${{ vars.AZURE_AD_CLIENT_ID }}
            VITE_AZURE_AD_AUTHORITY=${{ vars.AZURE_AD_AUTHORITY }}
            VITE_ARM_SCOPE=${{ vars.ARM_SCOPE }}
            VITE_FEEDBACK_CONTACT_ENABLED=${{ vars.FEEDBACK_CONTACT_ENABLED || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture rollback baseline
        if: steps.deployment.outputs.should_deploy == 'true'
        id: rollback_baseline
        run: |
          set -Eeuo pipefail
          previous_revision="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query properties.latestReadyRevisionName \
              --output tsv
          )"
          echo "revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Deploy the new Container Apps revision
        if: steps.deployment.outputs.should_deploy == 'true'
        run: |
          set -Eeuo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          revision_suffix="g${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_vars=(
            "PUBLIC_URL=${{ vars.AZURE_APP_URL }}"
            "ACCESS_CONTROL_ENABLED=${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}"
            "ACCESS_ADMIN_EMAIL=${{ vars.ACCESS_ADMIN_EMAIL }}"
            "AZURE_ACCESS_KEY_VAULT_RESOURCE_ID=${{ vars.AZURE_ACCESS_KEY_VAULT_RESOURCE_ID }}"
            "AZURE_CLIENT_ID=${{ vars.AZURE_RUNTIME_CLIENT_ID }}"
            "AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}"
            "AZURE_OPENAI_ALLOWED_DEPLOYMENTS=${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56SOL }},${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56TERRA }},${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT56LUNA }}"
            "ALLOW_BYO_AI_ENDPOINTS=true"
            "AZURE_FOUNDRY_ENDPOINT=${{ vars.AZURE_FOUNDRY_ENDPOINT }}"
            "AZURE_FOUNDRY_ALLOWED_DEPLOYMENTS=${{ vars.AZURE_FOUNDRY_DEPLOYMENT_CLAUDE_OPUS5 }}"
            "OPENAI_RATE_LIMIT_PER_HOUR=120"
            "AZURE_SPEECH_REGION=${{ vars.AZURE_SPEECH_REGION }}"
            "AZURE_SPEECH_RESOURCE_ID=${{ vars.AZURE_SPEECH_RESOURCE_ID }}"
            "MCP_ENABLED=${{ vars.MCP_ENABLED || 'false' }}"
            "MCP_HTTP_STATELESS=true"
            "MCP_HTTP_MAX_IN_FLIGHT=20"
            "MCP_SESSION_MAX=100"
            "MCP_SESSION_IDLE_SECONDS=1800"
            "MCP_SESSION_TTL_SECONDS=7200"
            "MCP_SESSION_GC_SECONDS=60"
            "FEEDBACK_EMAIL_ENDPOINT=${{ vars.FEEDBACK_EMAIL_ENDPOINT }}"
            "FEEDBACK_EMAIL_SENDER=${{ vars.FEEDBACK_EMAIL_SENDER }}"
            "FEEDBACK_EMAIL_RECIPIENT=${{ vars.FEEDBACK_EMAIL_RECIPIENT }}"
            "FEEDBACK_CONTACT_ENABLED=${{ vars.FEEDBACK_CONTACT_ENABLED || 'false' }}"
            "UPSTREAM_COMMIT=${{ needs.merge_validate.outputs.upstream_commit }}"
            "CUSTOMIZATION_COMMIT=${{ needs.merge_validate.outputs.fork_commit }}"
            "DESIRED_CONFIG_HASH=${{ steps.desired_config.outputs.hash }}"
            "DEPLOYED_AT=$deployed_at"
          )

          if [[ -n "${{ vars.AZURE_TABLES_ENDPOINT }}" ]]; then
            env_vars+=(
              "AZURE_TABLES_ENDPOINT=${{ vars.AZURE_TABLES_ENDPOINT }}"
              "AZURE_TABLES_FEEDBACK_TABLE=${{ vars.AZURE_TABLES_FEEDBACK_TABLE || 'feedback' }}"
              "AZURE_TABLES_RATE_LIMIT_TABLE=${{ vars.AZURE_TABLES_RATE_LIMIT_TABLE || 'ratelimit' }}"
            )
          fi
          if [[ -n "${{ vars.AZURE_COSMOS_ENDPOINT }}" ]]; then
            env_vars+=(
              "AZURE_COSMOS_ENDPOINT=${{ vars.AZURE_COSMOS_ENDPOINT }}"
              "COSMOS_DATABASE_ID=${{ vars.COSMOS_DATABASE_ID }}"
              "COSMOS_CONTAINER_ID=${{ vars.COSMOS_CONTAINER_ID }}"
              "COSMOS_FEEDBACK_CONTAINER_ID=${{ vars.COSMOS_FEEDBACK_CONTAINER_ID }}"
            )
          fi
          if [[ -n "${{ vars.AZURE_BLOB_ENDPOINT }}" ]]; then
            env_vars+=(
              "AZURE_BLOB_ENDPOINT=${{ vars.AZURE_BLOB_ENDPOINT }}"
              "AZURE_BLOB_DIAGRAMS_CONTAINER=${{ vars.AZURE_BLOB_DIAGRAMS_CONTAINER || 'diagrams' }}"
            )
          fi

          current_env_names="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query 'properties.template.containers[0].env[].name' \
              --output tsv
          )"
          remove_env_vars=()
          for name in AZURE_OPENAI_API_KEY AZURE_FOUNDRY_API_KEY; do
            grep -qx "$name" <<< "$current_env_names" && remove_env_vars+=("$name")
          done
          if [[ -z "${{ vars.AZURE_TABLES_ENDPOINT }}" ]]; then
            for name in AZURE_TABLES_ENDPOINT AZURE_TABLES_FEEDBACK_TABLE AZURE_TABLES_RATE_LIMIT_TABLE; do
              grep -qx "$name" <<< "$current_env_names" && remove_env_vars+=("$name")
            done
          fi
          if [[ -z "${{ vars.AZURE_COSMOS_ENDPOINT }}" ]]; then
            for name in AZURE_COSMOS_ENDPOINT COSMOS_DATABASE_ID COSMOS_CONTAINER_ID COSMOS_FEEDBACK_CONTAINER_ID; do
              grep -qx "$name" <<< "$current_env_names" && remove_env_vars+=("$name")
            done
          fi
          if [[ -z "${{ vars.AZURE_BLOB_ENDPOINT }}" ]]; then
            for name in AZURE_BLOB_ENDPOINT AZURE_BLOB_DIAGRAMS_CONTAINER; do
              grep -qx "$name" <<< "$current_env_names" && remove_env_vars+=("$name")
            done
          fi
          current_secret_names="$(
            az containerapp secret list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query '[].name' \
              --output tsv
          )"
          stale_api_key_secrets=()
          for name in azure-openai-api-key azure-foundry-api-key; do
            grep -qx "$name" <<< "$current_secret_names" && stale_api_key_secrets+=("$name")
          done

          update_args=(
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
            --name "${{ vars.AZURE_CONTAINER_APP }}"
            --image "${{ steps.image.outputs.image }}"
            --revision-suffix "$revision_suffix"
            --set-env-vars "${env_vars[@]}"
            --min-replicas 1
            --max-replicas 2
            --scale-rule-name http
            --scale-rule-http-concurrency 50
            --output none
          )
          if (( ${#remove_env_vars[@]} > 0 )); then
            update_args+=(--remove-env-vars "${remove_env_vars[@]}")
          fi
          touch /tmp/azurediagarm-deployment-started
          az containerapp update "${update_args[@]}"

          expected_revision="${{ vars.AZURE_CONTAINER_APP }}--${revision_suffix}"

          for attempt in $(seq 1 60); do
            latest="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --query properties.latestRevisionName \
                --output tsv
            )"
            ready="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --query properties.latestReadyRevisionName \
                --output tsv
            )"
            revision_state="$(
              az containerapp revision show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --revision "$expected_revision" \
                --query '[properties.provisioningState,properties.healthState,properties.runningState] | join(`|`, @)' \
                --output tsv 2>/dev/null || true
            )"
            if [[ "$latest" == "$expected_revision" && "$ready" == "$expected_revision" ]]; then
              [[ "$revision_state" == "Provisioned|Healthy|Running" || "$revision_state" == "Provisioned|Healthy|RunningAtMaxScale" ]] && break
            fi
            [[ "$attempt" -eq 60 ]] && {
              echo "Expected revision $expected_revision did not become ready (latest=$latest, ready=$ready, state=$revision_state)." >&2
              exit 1
            }
            sleep 10
          done

          # The first readiness migration must happen only after the new image
          # (which serves /readyz) is healthy under the previous probes.
          bash scripts/ensure-containerapp-probes.sh \
            "${{ vars.AZURE_RESOURCE_GROUP }}" \
            "${{ vars.AZURE_CONTAINER_APP }}" \
            "${{ steps.frontdoor.outputs.id }}"
          deployed_revision="$(
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query properties.latestReadyRevisionName \
              --output tsv
          )"
          [[ -n "$deployed_revision" ]]

          if (( ${#stale_api_key_secrets[@]} > 0 )); then
            az containerapp secret remove \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --secret-names "${stale_api_key_secrets[@]}" \
              --output none
          fi

          actual_image="$(
            az containerapp revision show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --revision "$deployed_revision" \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          actual_upstream="$(
            az containerapp revision show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --revision "$deployed_revision" \
              --query "properties.template.containers[0].env[?name=='UPSTREAM_COMMIT'].value | [0]" \
              --output tsv
          )"
          actual_customization="$(
            az containerapp revision show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --revision "$deployed_revision" \
              --query "properties.template.containers[0].env[?name=='CUSTOMIZATION_COMMIT'].value | [0]" \
              --output tsv
          )"
          actual_config_hash="$(
            az containerapp revision show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --revision "$deployed_revision" \
              --query "properties.template.containers[0].env[?name=='DESIRED_CONFIG_HASH'].value | [0]" \
              --output tsv
          )"
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --output json > /tmp/azurediagarm-deployed-app.json
          jq -e '
            all(
              .properties.template.containers[0].env[]?;
              .name != "AZURE_OPENAI_API_KEY" and .name != "AZURE_FOUNDRY_API_KEY"
            )
          ' /tmp/azurediagarm-deployed-app.json > /dev/null
          az containerapp secret list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query '[].name' \
            --output json > /tmp/azurediagarm-deployed-secrets.json
          jq -e '
            all(.[];
              . != "azure-openai-api-key" and . != "azure-foundry-api-key"
            )
          ' /tmp/azurediagarm-deployed-secrets.json > /dev/null
          az containerapp revision show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --revision "$deployed_revision" \
            --query properties.template.containers[0].probes \
            --output json > /tmp/azurediagarm-probes.json

          [[ "$actual_image" == "${{ steps.image.outputs.image }}" ]]
          [[ "$actual_upstream" == "${{ needs.merge_validate.outputs.upstream_commit }}" ]]
          [[ "$actual_customization" == "${{ needs.merge_validate.outputs.fork_commit }}" ]]
          [[ "$actual_config_hash" == "${{ steps.desired_config.outputs.hash }}" ]]
          jq -e --arg frontDoorId "${{ steps.frontdoor.outputs.id }}" '
            length == 3 and
            any(.[];
              .type == "Startup" and
              .httpGet.path == "/readyz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            ) and
            any(.[];
              .type == "Liveness" and
              .httpGet.path == "/healthz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            ) and
            any(.[];
              .type == "Readiness" and
              .httpGet.path == "/readyz" and
              .httpGet.port == 80 and
              any(.httpGet.httpHeaders[]?; .name == "X-Azure-FDID" and .value == $frontDoorId)
            )
          ' /tmp/azurediagarm-probes.json > /dev/null

      - name: Purge Front Door cache
        if: steps.deployment.outputs.should_deploy == 'true'
        run: |
          az afd endpoint purge \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
            --content-paths '/*' \
            --output none

      - name: Verify the production endpoint
        if: steps.deployment.outputs.should_deploy == 'true'
        env:
          ACCESS_CONTROL_ENABLED: ${{ vars.ACCESS_CONTROL_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          easy_auth_enabled="$(
            az containerapp auth show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --query platform.enabled \
              --output tsv
          )"
          [[ "$easy_auth_enabled" == "true" || "$easy_auth_enabled" == "false" ]] || {
            echo "::error::Could not determine whether Container Apps authentication is enabled."
            exit 1
          }
          authentication_required=false
          if [[ "$ACCESS_CONTROL_ENABLED" == "true" || "$easy_auth_enabled" == "true" ]]; then
            authentication_required=true
          fi

          for attempt in $(seq 1 30); do
            headers="$(mktemp)"
            checks_ok=true

            if [[ "$authentication_required" == "true" ]]; then
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 15 \
                --max-time 45 \
                --user-agent 'AzureDiagarm-GitHub-Updater/1.0' \
                --dump-header "$headers" \
                --output /tmp/azurediagarm-health.txt \
                "${{ vars.AZURE_APP_URL }}/healthz"; then
                grep -qx 'ok' /tmp/azurediagarm-health.txt || checks_ok=false
                grep -qi '^x-robots-tag:.*noindex' "$headers" || checks_ok=false
                grep -qi '^referrer-policy:.*same-origin' "$headers" || checks_ok=false

                root_status="$(
                  curl \
                    --silent \
                    --output /dev/null \
                    --dump-header /tmp/azurediagarm-auth-headers.txt \
                    --write-out '%{http_code}' \
                    --max-redirs 0 \
                    --connect-timeout 15 \
                    --max-time 45 \
                    "${{ vars.AZURE_APP_URL }}/" || true
                )"
                [[ "$root_status" == "302" || "$root_status" == "401" ]] || checks_ok=false
                if [[ "$root_status" == "302" ]]; then
                  grep -qi '^location:.*\.auth/login/aad' /tmp/azurediagarm-auth-headers.txt || checks_ok=false
                fi
              else
                checks_ok=false
              fi
            elif curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 90 \
              --user-agent 'AzureDiagarm-GitHub-Updater/1.0' \
              --dump-header "$headers" \
              --output /tmp/azurediagarm.html \
              "${{ vars.AZURE_APP_URL }}/"; then
              grep -qi '^x-robots-tag:.*noindex' "$headers" || checks_ok=false
              grep -qi '^referrer-policy:.*same-origin' "$headers" || checks_ok=false
              grep -qi '^permissions-policy:' "$headers" || checks_ok=false
              grep -q 'Azure Architecture Diagram Builder' /tmp/azurediagarm.html || checks_ok=false
            else
              checks_ok=false
            fi

            if [[ "$checks_ok" == "true" ]]; then
              invalid_deployment_status="$(
                curl \
                  --silent \
                  --output /tmp/azurediagarm-openai-check.json \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"apiFormat":"responses","deployment":"not-allowed","body":{"model":"not-allowed","input":[],"max_output_tokens":1}}' \
                  "${{ vars.AZURE_APP_URL }}/api/openai" || true
              )"
              if [[ "$authentication_required" == "true" ]]; then
                [[ "$invalid_deployment_status" == "302" || "$invalid_deployment_status" == "401" || "$invalid_deployment_status" == "403" ]] || checks_ok=false
              else
                [[ "$invalid_deployment_status" == "403" ]] || checks_ok=false
              fi

              origin_fqdn="$(
                az containerapp show \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --name "${{ vars.AZURE_CONTAINER_APP }}" \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv 2>/dev/null || true
              )"
              origin_status="$(
                curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 30 \
                  "https://${origin_fqdn}/" || true
              )"
              [[ "$origin_status" == "403" ]] || checks_ok=false

              spoofed_origin_status="$(
                curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 30 \
                  --header "X-Azure-FDID: $(
                    az afd profile show \
                      --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                      --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
                      --query frontDoorId \
                      --output tsv
                  )" \
                  "https://${origin_fqdn}/healthz" || true
              )"
              [[ "$spoofed_origin_status" == "403" ]] || checks_ok=false

              mcp_status="$(
                curl \
                  --silent \
                  --output /tmp/azurediagarm-mcp-check.json \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deployment-check","version":"1.0"}}}' \
                  "${{ vars.AZURE_APP_URL }}/mcp" || true
              )"
              if [[ "$authentication_required" == "true" ]]; then
                [[ "$mcp_status" == "302" || "$mcp_status" == "401" || "$mcp_status" == "403" ]] || checks_ok=false
              else
                [[ "$mcp_status" == "401" || "$mcp_status" == "404" ]] || checks_ok=false
              fi

              if [[ "$checks_ok" == "true" ]]; then
                rm -f "$headers"
                exit 0
              fi
            fi
            rm -f "$headers"
            echo "Production verification attempt $attempt failed; retrying." >&2
            sleep 20
          done
          echo "Production verification failed." >&2
          exit 1

      - name: Roll back a failed production revision
        if: ${{ failure() && steps.deployment.outputs.should_deploy == 'true' }}
        run: |
          set -Eeuo pipefail
          if [[ ! -f /tmp/azurediagarm-deployment-started ]]; then
            echo "Deployment did not start; no production rollback is required."
            exit 0
          fi
          previous_revision="${{ steps.rollback_baseline.outputs.revision }}"
          if [[ -z "$previous_revision" ]]; then
            echo "::error::No previously ready revision is available for rollback."
            exit 1
          fi

          rollback_suffix="rb${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rollback_revision="${{ vars.AZURE_CONTAINER_APP }}--${rollback_suffix}"
          echo "Rolling back to $previous_revision via $rollback_revision."
          az containerapp revision copy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --from-revision "$previous_revision" \
            --revision-suffix "$rollback_suffix" \
            --output none

          for attempt in $(seq 1 60); do
            ready="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --query properties.latestReadyRevisionName \
                --output tsv
            )"
            state="$(
              az containerapp revision show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.AZURE_CONTAINER_APP }}" \
                --revision "$rollback_revision" \
                --query '[properties.provisioningState,properties.healthState,properties.runningState] | join(`|`, @)' \
                --output tsv 2>/dev/null || true
            )"
            if [[ "$ready" == "$rollback_revision" && ( "$state" == "Provisioned|Healthy|Running" || "$state" == "Provisioned|Healthy|RunningAtMaxScale" ) ]]; then
              break
            fi
            [[ "$attempt" -eq 60 ]] && {
              echo "::error::Rollback revision $rollback_revision did not become healthy (ready=$ready, state=$state)."
              exit 1
            }
            sleep 10
          done

          az afd endpoint purge \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ vars.AZURE_FRONT_DOOR_PROFILE }}" \
            --endpoint-name "${{ vars.AZURE_FRONT_DOOR_ENDPOINT }}" \
            --content-paths '/*' \
            --output none
          printf '\n- Automatic rollback restored revision %s as %s.\n' \
            "$previous_revision" "$rollback_revision" >> update-details.txt

      - name: Refresh Azure sign-in for deployment notification
        if: ${{ !cancelled() && steps.deployment.outputs.should_deploy == 'true' }}
        continue-on-error: true
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Send detailed update email
        id: success_notification
        if: steps.deployment.outputs.should_deploy == 'true'
        continue-on-error: true
        env:
          AZURE_COMMUNICATION_ENDPOINT: ${{ vars.FEEDBACK_EMAIL_ENDPOINT }}
          AZURE_EMAIL_SENDER: ${{ vars.AZURE_EMAIL_SENDER }}
          AZURE_EMAIL_RECIPIENT: ${{ vars.AZURE_EMAIL_RECIPIENT }}
          AZURE_EMAIL_SUBJECT: AzureDiagarm update completed - ${{ needs.merge_validate.outputs.upstream_short }}
        run: |
          set -Eeuo pipefail

          {
            echo "Azure Architecture Diagram Builder was updated successfully."
            echo
            echo "URL: ${{ vars.AZURE_APP_URL }}"
            echo "Image: ${{ steps.image.outputs.image }}"
            echo "Upstream commit: ${{ needs.merge_validate.outputs.upstream_commit }}"
            echo "Customization commit: ${{ needs.merge_validate.outputs.fork_commit }}"
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Upstream update details:"
            cat update-details.txt
          } > email-body.txt

          bash scripts/send-acs-email.sh email-body.txt

      - name: Report update email failure
        if: steps.success_notification.outcome == 'failure'
        run: |
          echo "::warning::Deployment succeeded, but the success email notification failed."
          {
            echo "### Deployment notification warning"
            echo
            echo "The deployment succeeded, but the success email notification failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send failure email
        if: failure()
        continue-on-error: true
        env:
          AZURE_COMMUNICATION_ENDPOINT: ${{ vars.FEEDBACK_EMAIL_ENDPOINT }}
          AZURE_EMAIL_SENDER: ${{ vars.AZURE_EMAIL_SENDER }}
          AZURE_EMAIL_RECIPIENT: ${{ vars.AZURE_EMAIL_RECIPIENT }}
          AZURE_EMAIL_SUBJECT: AzureDiagarm update failed
        run: |
          set -Eeuo pipefail
          {
            printf 'The AzureDiagarm sync or deployment failed.\n\n%s\n\nWorkflow: %s\n' \
              "$(
                if [[ -s update-details.txt ]]; then
                  cat update-details.txt
                else
                  printf 'No additional failure details were generated.'
                fi
              )" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > email-body.txt
          bash scripts/send-acs-email.sh email-body.txt
